name: Check game changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            filter: ''
          - browser: webkit
            filter: 'free dice choice|used doubles|selected die controls|previous five rolls|normal doubles|iPad messages|centered game messages|VENGEANCE changes|tablet rotation|returning-player sound|music is opt-in'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check rules and computer strategy
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Install browser for interface checks
        run: |
          # The Azure Ubuntu mirror can stall WebKit's system-package downloads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          npm exec -- playwright install --with-deps ${{ matrix.browser }}
      - name: Check messages and responsive game interface
        env:
          BACKGAMMON_TEST_URL: http://127.0.0.1:4173/war-peace-backgammon/
          BACKGAMMON_BROWSER: ${{ matrix.browser }}
          BACKGAMMON_TEST_FILTER: ${{ matrix.filter }}
          BACKGAMMON_SCREENSHOT_DIRECTORY: /tmp/backgammon-browser-regression/${{ matrix.browser }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/backgammon-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail "$BACKGAMMON_TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Save interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-interface-checks-${{ matrix.browser }}
          path: /tmp/backgammon-browser-regression
          if-no-files-found: ignore
          retention-days: 7
